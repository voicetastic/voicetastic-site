# Build the Astro site and publish to GitHub Pages on every push to `main`.
#
# Parallel to `.gitlab-ci.yml`, which still publishes to GitLab Pages —
# both pipelines run the same `npm install && npm run build`. Decide
# which deploy URL is canonical and update `site:` in `astro.config.mjs`
# accordingly; the other deploy keeps working as a redundant mirror.
#
# Setup checklist (one-time, after the repo is created on GitHub):
#   Settings → Pages → "Build and deployment" → Source: "GitHub Actions".
#   (No need to pick a branch — the deploy-pages action publishes the
#   uploaded artifact directly.)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          # `cache: 'npm'` would require a committed package-lock.json;
          # the GitLab pipeline still does `npm install --no-audit --no-fund`
          # without one, so match that here until the lockfile lands.

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
