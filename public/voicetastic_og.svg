<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBDBC9"/>
      <stop offset="1" stop-color="#F6C4A6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.22" r="0.6">
      <stop offset="0" stop-color="#FFEDE1" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFEDE1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- ===== MESH MOTIF (right side, clear of text) ===== -->
  <g stroke="#262A38" stroke-opacity="0.28" stroke-width="2.5" stroke-dasharray="2 9" stroke-linecap="round">
    <line x1="905" y1="210" x2="1005" y2="165"/>
    <line x1="1005" y1="165" x2="1115" y2="250"/>
    <line x1="1005" y1="165" x2="1015" y2="335"/>
    <line x1="1115" y1="250" x2="1015" y2="335"/>
    <line x1="1115" y1="250" x2="1120" y2="405"/>
    <line x1="1015" y1="335" x2="1120" y2="405"/>
    <line x1="1015" y1="335" x2="928" y2="445"/>
    <line x1="1120" y1="405" x2="945" y2="470"/>
  </g>

  <!-- highlighted voice route: sender -> hop -> hop -> recipient -->
  <g fill="none" stroke="#EE7A4D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M888 224 L1005 165 L1015 335 L928 438"/>
  </g>

  <!-- mesh nodes -->
  <g fill="#262A38">
    <circle cx="1005" cy="165" r="11"/>
    <circle cx="1015" cy="335" r="11"/>
    <circle cx="1115" cy="250" r="11"/>
    <circle cx="1120" cy="405" r="11"/>
  </g>
  <!-- active nodes on the route -->
  <g fill="#EE7A4D">
    <circle cx="1005" cy="165" r="7"/>
    <circle cx="1015" cy="335" r="7"/>
  </g>

  <!-- sender: record bubble with waveform -->
  <g>
    <rect x="825" y="132" width="124" height="84" rx="20" fill="#262A38"/>
    <path d="M872 216 l16 0 l-8 16 z" fill="#262A38"/>
    <g fill="#EE7A4D">
      <rect x="845" y="166" width="7" height="16" rx="3.5"/>
      <rect x="858" y="156" width="7" height="36" rx="3.5"/>
      <rect x="871" y="148" width="7" height="52" rx="3.5"/>
      <rect x="884" y="159" width="7" height="30" rx="3.5"/>
      <rect x="897" y="166" width="7" height="16" rx="3.5"/>
      <rect x="910" y="161" width="7" height="26" rx="3.5"/>
      <rect x="923" y="169" width="7" height="10" rx="3.5"/>
    </g>
  </g>

  <!-- recipient: play device -->
  <g>
    <rect x="872" y="432" width="112" height="80" rx="16" fill="#FFF4ED" stroke="#262A38" stroke-width="4"/>
    <path d="M918 454 l30 18 l-30 18 z" fill="#EE7A4D"/>
  </g>

  <!-- ===== TEXT (left) ===== -->
  <!-- logo mark (brand vector drawable) -->
  <g transform="translate(44.48,30.79) scale(1.06)">
    <g transform="translate(62.16,54.25) rotate(180) translate(-54,-54)">
      <g transform="translate(18.36,18.36) scale(2.4944882)">
        <g transform="translate(-17.561,-14.390) scale(2)">
          <path d="m17.5564,11.8482 l-5.208,7.6376 -1.5217,-1.0377 5.9674,-8.7512c0.1714,-0.2513 0.4558,-0.4019 0.76,-0.4022 0.3042,-0.0003 0.5889,0.1497 0.7608,0.4008l5.9811,8.7374 -1.5199,1.0404z"
                fill="#262A38" fill-rule="evenodd"/>
        </g>
      </g>
    </g>
  </g>
  <text x="152" y="104" font-size="34" font-weight="bold" fill="#262A38" letter-spacing="0.5">Voicetastic</text>

  <!-- headline -->
  <text x="68" y="262" font-size="72" font-weight="bold" fill="#262A38">Voice messages.</text>
  <text x="68" y="346" font-size="72" font-weight="bold" fill="#262A38">Over Meshtastic.</text>
  <rect x="70" y="366" width="430" height="9" rx="4.5" fill="#EE7A4D"/>

  <!-- chips (symmetric padding) -->
  <g font-size="24" font-weight="bold" fill="#262A38">
    <g>
      <rect x="68" y="420" width="182" height="50" rx="25" fill="#FFF4ED" stroke="#262A38" stroke-width="2.5"/>
      <circle cx="98" cy="445" r="6" fill="#EE7A4D"/>
      <text x="116" y="453">Off-grid</text>
    </g>
    <g>
      <rect x="266" y="420" width="209" height="50" rx="25" fill="#FFF4ED" stroke="#262A38" stroke-width="2.5"/>
      <circle cx="296" cy="445" r="6" fill="#EE7A4D"/>
      <text x="314" y="453">No server</text>
    </g>
    <g>
      <rect x="491" y="420" width="248" height="50" rx="25" fill="#FFF4ED" stroke="#262A38" stroke-width="2.5"/>
      <circle cx="521" cy="445" r="6" fill="#EE7A4D"/>
      <text x="539" y="453">Open source</text>
    </g>
  </g>

  <!-- tech stack -->
  <text x="70" y="560" font-size="23" font-weight="bold" fill="#262A38" fill-opacity="0.75" letter-spacing="3">RUST · KOTLIN · WEBASSEMBLY · C++</text>
</svg>
